<style>
:root {
  --fondo: #E0DEDA;   /* gris hueso */
  --tinta: #1A171B;   /* negro cálido */
  --naranja: #F89127;
  --suave: rgba(26,23,27,.64);
  --linea: rgba(26,23,27,.14);
  --hueco: rgba(26,23,27,.07);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fondo); color: var(--tinta); }
body {
  font-family: "Quicksand", "Nunito", system-ui, sans-serif;
  font-weight: 500; font-size: 15px; line-height: 1.45;
  min-height: 100vh; overflow-x: hidden;
}
b, strong { font-weight: 700; }
.clave { color: var(--naranja); font-weight: 700; }

/* Formas orgánicas de las esquinas */
body { position: relative; }
.forma { position: absolute; border-radius: 50%; background: var(--naranja); pointer-events: none; z-index: 0;
  box-shadow: inset 0 -12px 26px rgba(26,23,27,.16); }
.forma-1 { width: 150px; height: 150px; top: -95px; right: -95px; }
.forma-2 { width: 150px; height: 150px; bottom: -80px; left: -70px; }

main { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; padding: 28px 16px 40px; }

/* Marca */
.marca { margin-bottom: 30px; }
.logo { display: block; width: 250px; max-width: 72%; height: auto; margin: 0 auto; }

/* Bloque esencial */
.saludo h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; text-transform: uppercase; }
.saludo h1 em { font-style: normal; color: var(--naranja); }
.mensaje { margin: 6px 0 0; color: var(--suave); }
.nivel { display: inline-block; margin-top: 14px; padding: 5px 14px; border-radius: 999px; border: 2px solid var(--tinta);
  font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.nivel-plata { background: var(--naranja); }
.nivel-oro { background: var(--tinta); color: var(--naranja); }

.sellos { margin-top: 26px; }
.sellos-fila { display: flex; align-items: baseline; gap: 10px; }
.sellos-num { font-size: 68px; font-weight: 700; line-height: 1; color: var(--naranja); font-variant-numeric: tabular-nums; }
.sellos-et { font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 13px; }
.barra { margin-top: 12px; height: 16px; border-radius: 999px; border: 2px solid var(--tinta); background: var(--hueco); overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--naranja); border-radius: 999px; transition: width .6s ease; }
.barra-texto { margin: 8px 0 0; font-size: 14px; }

.aviso { margin-top: 22px; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px;
  border: 2px solid var(--tinta); border-radius: 18px; }
.aviso.destacado { background: var(--naranja); }
.aviso-ico { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--tinta);
  display: flex; align-items: center; justify-content: center; }
.aviso.destacado .aviso-ico { background: var(--fondo); }
.aviso-ico svg { width: 18px; height: 18px; }
.aviso-cuerpo { flex: 1; }
.aviso-titulo { font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 14px; }
.aviso-texto { margin-top: 2px; font-size: 14px; }
.aviso-accion { margin-top: 8px; }
.cerrar { flex: none; background: none; border: 0; font: inherit; font-size: 20px; line-height: 1; padding: 2px 4px; cursor: pointer; color: var(--tinta); }

/* Secciones */
.secciones { margin-top: 30px; }
details { border-top: 2px solid var(--tinta); }
details:last-of-type { border-bottom: 2px solid var(--tinta); }
summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 16px 2px; cursor: pointer;
  font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; }
summary::-webkit-details-marker { display: none; }
summary svg.ico { width: 20px; height: 20px; color: var(--naranja); }
summary .cuenta { margin-left: auto; font-size: 12px; color: var(--suave); letter-spacing: .04em; }
summary .flecha { width: 16px; height: 16px; transition: transform .2s; }
details[open] summary .flecha { transform: rotate(180deg); }
.panel { padding: 0 2px 16px; }
.vacio { color: var(--suave); font-size: 14px; margin: 0 0 4px; }
.nota { color: var(--suave); font-size: 13px; margin: 10px 0 0; }

.premio { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linea); }
.premio:last-child { border-bottom: 0; }
.costo { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--naranja); display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-weight: 700; font-size: 18px; line-height: 1; }
.costo small { font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.costo.perm { border-color: var(--tinta); }
.costo.perm svg { width: 20px; height: 20px; }
.premio-nombre { font-weight: 700; }
.premio-desc { font-size: 13px; color: var(--suave); }
.premio-falta { font-size: 12px; color: var(--suave); white-space: nowrap; }

.btn { font: inherit; font-weight: 700; font-size: 13px; border: 2px solid var(--tinta); background: var(--naranja); color: var(--tinta);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:disabled { background: transparent; color: var(--suave); border-color: var(--linea); cursor: default; }
.btn-fondo { background: var(--fondo); }

.pedido { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
.pedido:last-child { border-bottom: 0; }
.pedido-ico { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--naranja); display: flex; align-items: center; justify-content: center; }
.pedido-ico svg { width: 18px; height: 18px; }
.pedido-nombre { flex: 1; font-weight: 600; }
.pedido-fecha { font-size: 13px; color: var(--suave); }

.medallas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
.medalla { text-align: center; font-size: 12.5px; font-weight: 600; line-height: 1.25;
  font-family: inherit; color: inherit; background: none; border: 0; padding: 4px 2px; border-radius: 12px; cursor: pointer; }
.medalla:focus-visible { outline: 2px solid var(--naranja); outline-offset: 2px; }
.medalla.activa .medalla-ico { box-shadow: 0 0 0 3px var(--fondo), 0 0 0 5px var(--naranja); }
.logro-detalle { margin-top: 14px; padding: 12px 14px; border: 2px solid var(--tinta); border-radius: 16px; font-size: 14px; }
.logro-detalle.ganado { background: var(--naranja); }
.logro-titulo { font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; }
.logro-requisito { margin-top: 4px; }
.logro-estado { margin-top: 6px; font-size: 13px; font-weight: 600; }
.logro-detalle:not(.ganado) .logro-estado { color: var(--suave); }
.medalla-ico { width: 56px; height: 56px; margin: 0 auto 6px; border-radius: 50%; border: 2px solid var(--tinta); background: var(--naranja);
  display: flex; align-items: center; justify-content: center; }
.medalla-ico svg { width: 24px; height: 24px; }
.medalla.bloqueada { color: var(--suave); }
.medalla.bloqueada .medalla-ico { background: transparent; border: 2px dashed var(--linea); color: var(--suave); }
.medalla-fecha { display: block; font-size: 11px; color: var(--suave); font-weight: 500; }

/* Contacto */
.contacto { display: flex; gap: 10px; margin-top: 28px; }
.contacto .btn { padding: 12px 18px; font-size: 14px; }
.contacto .wa { flex: 1; justify-content: center; }
.contacto svg { width: 18px; height: 18px; }
.pie { margin-top: 22px; text-align: center; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--suave); }

/* Estados */
.estado { padding: 60px 0; text-align: center; }
.estado p { color: var(--suave); }
.cargando { width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%; border: 4px solid var(--hueco); border-top-color: var(--naranja); animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .cargando { animation: none; } .barra i { transition: none; } }

svg.lin { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>

function iconoProducto(p) {
  const t = p.toLowerCase();
  if (/polaroid|foto/.test(t)) return 'foto';
  if (/carrete/.test(t)) return 'carrete';
  if (/sticker|pegatina/.test(t)) return 'sticker';
  if (/p[oó]ster|mapa/.test(t)) return 'poster';
  if (/im[aá]n/.test(t)) return 'iman';
  if (/tarjeta/.test(t)) return 'tarjeta';
  if (/combo|regalo/.test(t)) return 'regalo';
  return 'bolsa';
}

// ===== Utilidades =====
function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
}
function leer(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function borrar(k) { try { localStorage.removeItem(k); } catch (e) {} }

function aFecha(txt) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(txt || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function fechaCorta(txt) {
  const f = aFecha(txt);
  return f ? f.getDate() + ' ' + MESES[f.getMonth()] + (f.getFullYear() !== new Date().getFullYear() ? ' ' + f.getFullYear() : '') : '';
}
function diasDesde(txt) {
  const f = aFecha(txt);
  if (!f) return null;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  return Math.round((hoy - f) / 86400000);
}
const primerNombre = n => String(n || '').trim().split(/\s+/)[0] || '';
const plural = (n, uno, varios) => n === 1 ? uno : varios;

// ===== Mensaje personalizado bajo el saludo =====
function mensaje(d) {
  const hoy = new Date(), mes = hoy.getMonth(), dia = hoy.getDate();
  if (!d.historial.length && !d.sellos) return 'Tu primera compra te da tus primeros sellos.';
  if (mes === 0 || (mes === 1 && dia <= 14)) return 'San Valentín se acerca: pide tu regalo con tiempo.';
  if (mes === 11) return 'Diciembre es mes de regalos. ¡Pide con tiempo!';
  if (d.nivel.toLowerCase() === 'oro') return 'Nivel Oro: ya eres de la casa.';
  if (!d.sellos) return 'Tus sellos vuelven a sumar con cada compra.';
  return 'Gracias por seguir confiando en nosotros.';
}

// ===== Aviso único, por prioridad =====
function elegirAviso(d, listos, siguiente, confirmado, pendiente) {
  if (confirmado) return { destacado: true, icono: 'check', titulo: '¡Canje confirmado!',
    texto: `Ya tienes tu <b>${esc(confirmado)}</b>. ¡Que lo disfrutes!` };
  if (listos.length && !pendiente) return { destacado: true, icono: 'regalo', titulo: '¡Tienes un premio listo!',
    texto: listos.length === 1 ? `Ya puedes canjear <b>${esc(listos[0].nombre)}</b>.` : `Ya puedes canjear <b>${listos.length} premios</b>.`,
    accion: 'Ver premios' };
  if (siguiente && siguiente.costo - d.sellos <= 3) {
    const n = siguiente.costo - d.sellos;
    return { icono: 'estrella', titulo: '¡Ya casi!',
      texto: `Te ${plural(n, 'falta', 'faltan')} <b>${n} ${plural(n, 'sello', 'sellos')}</b> para <b>${esc(siguiente.nombre)}</b>.` };
  }
  const dias = diasDesde(d.ultimaVisita);
  if (dias !== null && dias >= DIAS_INACTIVIDAD) return { icono: 'reloj', titulo: 'Te echamos de menos',
    texto: `Hace ${dias} días que no te vemos. ¿Preparamos algo bonito?` };
  if (!leer(CLAVE_BIENVENIDA)) return { icono: 'hola', titulo: '¡Te damos la bienvenida!', cerrable: true,
    texto: 'Cada compra en ImpresionA te da <b>sellos</b>, y cada <b>medalla</b> uno más. Júntalos y cámbialos por <b>premios</b>. Y cuanto más compras, más sube tu <b>nivel</b>.' };
  return null;
}

// ===== Pintar la tarjeta =====

  if (!d) {
    app.innerHTML = `<div class="estado"><p><b>No encontramos tu tarjeta.</b><br>Escríbenos por WhatsApp y lo revisamos.</p></div>`;
    return;
  }
  datos = d;
  d.historial = d.historial || [];
  d.premios = d.premios || [];
  d.logros = d.logros || [];

  const consumibles = d.premios.filter(p => p.tipo === 'consumible').sort((a, b) => a.costo - b.costo);
  const permanentes = d.premios.filter(p => p.tipo === 'permanente');
  const hitos = d.premios.filter(p => p.tipo === 'hito');
  const listos = consumibles.filter(p => p.costo <= d.sellos);
  const siguiente = consumibles.find(p => p.costo > d.sellos);

  // Canje pendiente: se da por confirmado cuando bajan los sellos en la hoja
  let pendiente = leer(CLAVE_CANJE), confirmado = null;
  if (pendiente && d.sellos < pendiente.sellos) { confirmado = pendiente.premio; borrar(CLAVE_CANJE); pendiente = null; }

  // Barra de sellos: avance hacia el próximo premio
  const meta = siguiente ? siguiente.costo : (consumibles.length ? consumibles[consumibles.length - 1].costo : 10);
  const pct = Math.max(d.sellos ? 4 : 0, Math.min(100, Math.round(d.sellos / meta * 100)));
  let textoBarra;
  if (siguiente) {
    const n = siguiente.costo - d.sellos;
    textoBarra = `Te ${plural(n, 'falta', 'faltan')} <b>${n}</b> para <span class="clave">${esc(siguiente.nombre)}</span>`;
  } else if (consumibles.length) {
    textoBarra = '<span class="clave">¡Puedes canjear cualquier premio!</span>';
  } else {
    textoBarra = 'Pronto verás aquí tu próximo premio.';
  }

  const aviso = elegirAviso(d, listos, siguiente, confirmado, pendiente);
  const nivel = esc(d.nivel);

  app.innerHTML = `
    <section class="saludo">
      <h1>¡Holaa, <em>${esc(primerNombre(d.nombre))}</em>!</h1>
      <p class="mensaje">${mensaje(d)}</p>
      <span class="nivel nivel-${nivel.toLowerCase()}">Nivel ${nivel}</span>
    </section>

    <section class="sellos" aria-label="Tus sellos">
      <div class="sellos-fila"><span class="sellos-num">${d.sellos}</span><span class="sellos-et">${plural(d.sellos, 'sello disponible', 'sellos disponibles')}</span></div>
      <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${Math.min(d.sellos, meta)}"><i style="width:0"></i></div>
      <p class="barra-texto">${textoBarra}</p>
    </section>

    ${aviso ? `
    <div class="aviso ${aviso.destacado ? 'destacado' : ''}" id="aviso">
      <div class="aviso-ico">${ico(aviso.icono)}</div>
      <div class="aviso-cuerpo">
        <div class="aviso-titulo">${aviso.titulo}</div>
        <div class="aviso-texto">${aviso.texto}</div>
        ${aviso.accion ? `<div class="aviso-accion"><button class="btn btn-fondo" id="ir-premios">${aviso.accion}</button></div>` : ''}
      </div>
      ${aviso.cerrable ? `<button class="cerrar" id="cerrar-aviso" aria-label="Cerrar">×</button>` : ''}
    </div>` : ''}

    <div class="secciones">
      <details open id="sec-premios">
        <summary>${ico('regalo', 'ico')} Recompensas <span class="cuenta">${listos.length ? listos.length + ' ' + plural(listos.length, 'lista', 'listas') : ''}</span>${ico('flecha', 'flecha')}</summary>
        <div class="panel">${pintarPremios(consumibles, permanentes, pendiente, d)}</div>
      </details>
      <details>
        <summary>${ico('bolsa', 'ico')} Mis pedidos <span class="cuenta">${d.historial.length || ''}</span>${ico('flecha', 'flecha')}</summary>
        <div class="panel">${pintarHistorial(d.historial)}</div>
      </details>
      <details>
        <summary>${ico('medalla', 'ico')} Logros <span class="cuenta">${d.logros.length ? d.logros.length + (hitos.length ? '/' + Math.max(hitos.length, d.logros.length) : '') : ''}</span>${ico('flecha', 'flecha')}</summary>
        <div class="panel">${pintarLogros(hitos, d.logros)}</div>
      </details>
    </div>`;

  requestAnimationFrame(() => { const b = app.querySelector('.barra i'); if (b) b.style.width = pct + '%'; });

  const cerrar = document.getElementById('cerrar-aviso');
  if (cerrar) cerrar.onclick = () => { guardar(CLAVE_BIENVENIDA, true); document.getElementById('aviso').remove(); };
  const ir = document.getElementById('ir-premios');
  if (ir) ir.onclick = () => { const s = document.getElementById('sec-premios'); s.open = true; s.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  app.querySelectorAll('[data-canjear]').forEach(b => b.onclick = () => canjear(consumibles[+b.dataset.canjear]));
  app.querySelectorAll('[data-logro]').forEach(b => b.onclick = () => mostrarLogro(b));
}

function pintarPremios(consumibles, permanentes, pendiente, d) {
  if (!consumibles.length && !permanentes.length) return '<p class="vacio">Muy pronto tendrás aquí los premios que puedes ganar.</p>';
  let html = consumibles.map((p, i) => {
    let lado;
    if (pendiente && pendiente.premio === p.nombre) lado = '<button class="btn" disabled>Solicitud enviada</button>';
    else if (p.costo <= d.sellos) lado = `<button class="btn" data-canjear="${i}" ${pendiente ? 'disabled' : ''}>Canjear</button>`;
    else lado = `<span class="premio-falta">Faltan ${p.costo - d.sellos}</span>`;
    return `<div class="premio">
      <div class="costo">${p.costo}<small>${plural(p.costo, 'sello', 'sellos')}</small></div>
      <div><div class="premio-nombre">${esc(p.nombre)}</div>${p.descripcion ? `<div class="premio-desc">${esc(p.descripcion)}</div>` : ''}</div>
      ${lado}
    </div>`;
  }).join('');
  html += permanentes.map(p => `<div class="premio">
      <div class="costo perm">${ico('estrella')}</div>
      <div><div class="premio-nombre">${esc(p.nombre)}</div><div class="premio-desc">${esc(p.descripcion || 'Ventaja de tu nivel')}</div></div>
      <span></span>
    </div>`).join('');
  if (pendiente) html += '<p class="nota">Te confirmamos el canje por WhatsApp. Mientras, el resto de premios espera.</p>';
  return html;
}

function pintarHistorial(h) {
  if (!h.length) return '<p class="vacio">Aquí verás tus pedidos de ImpresionA.</p>';
  return h.map(p => `<div class="pedido">
      <div class="pedido-ico">${ico(iconoProducto(p.producto))}</div>
      <div class="pedido-nombre">${esc(p.producto)}</div>
      <div class="pedido-fecha">${fechaCorta(p.fecha)}</div>
    </div>`).join('');
}

function pintarLogros(hitos, logros) {
  const ganados = new Map(logros.map(l => [l.nombre.trim().toLowerCase(), l]));
  const lista = hitos.map(h => ({ nombre: h.nombre, desc: h.descripcion, ganado: ganados.get(h.nombre.trim().toLowerCase()) }));
  logros.forEach(l => { if (!hitos.some(h => h.nombre.trim().toLowerCase() === l.nombre.trim().toLowerCase())) lista.push({ nombre: l.nombre, ganado: l }); });
  if (!lista.length) return '<p class="vacio">Con tus compras irás ganando medallas.</p>';
  lista.sort((a, b) => (b.ganado ? 1 : 0) - (a.ganado ? 1 : 0));
  logrosLista = lista;
  return `<div class="medallas">${lista.map((m, i) => `
    <button type="button" class="medalla ${m.ganado ? '' : 'bloqueada'}" data-logro="${i}" aria-expanded="false" aria-controls="logro-detalle">
      <span class="medalla-ico">${ico(m.ganado ? 'medalla' : 'candado')}</span>
      ${esc(m.nombre)}${m.ganado && m.ganado.fecha ? `<span class="medalla-fecha">${fechaCorta(m.ganado.fecha)}</span>` : ''}
    </button>`).join('')}</div>
    <div class="logro-detalle" id="logro-detalle" aria-live="polite" hidden></div>
    <p class="nota">Cada medalla te da 1 sello. Toca una para ver cómo conseguirla.</p>`;
}

// Al tocar una medalla se muestra debajo qué hay que hacer para conseguirla (otro toque la cierra)
let logrosLista = [];
function mostrarLogro(boton) {
  const caja = document.getElementById('logro-detalle');
  const yaAbierta = boton.classList.contains('activa');
  document.querySelectorAll('.medalla.activa').forEach(b => { b.classList.remove('activa'); b.setAttribute('aria-expanded', 'false'); });
  if (yaAbierta) { caja.hidden = true; return; }
  const m = logrosLista[+boton.dataset.logro];
  if (!m) return;
  boton.classList.add('activa');
  boton.setAttribute('aria-expanded', 'true');
  const requisito = m.desc ? esc(m.desc) : 'Un logro especial de ImpresionA.';
  const estado = m.ganado
    ? '¡Conseguido' + (m.ganado.fecha ? ' el ' + fechaCorta(m.ganado.fecha) : '') + '! Ya sumó 1 sello a tu tarjeta.'
    : 'Aún no lo tienes. Al conseguirlo ganas 1 sello. ¡A por él!';
  caja.className = 'logro-detalle' + (m.ganado ? ' ganado' : '');
  caja.innerHTML = `<div class="logro-titulo">${esc(m.nombre)}</div>
    <div class="logro-requisito"><b>Cómo conseguirlo:</b> ${requisito}</div>
    <div class="logro-estado">${estado}</div>`;
  caja.hidden = false;
}

// ===== Canje por WhatsApp prellenado =====
function canjear(p) {
  if (!p) return;
  const texto = `Holaa! Quiero canjear mi premio: ${p.nombre} (${p.costo} sellos). Mi código de tarjeta es ${CODIGO}.`;
  window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(texto), '_blank');
  guardar(CLAVE_CANJE, { premio: p.nombre, sellos: datos.sellos });
  pintar(datos);
}

// ===== Arranque =====
function errorDeCarga() {
  document.getElementById('app').innerHTML = '<div class="estado"><p><b>No pudimos cargar tu tarjeta.</b><br>Revisa tu conexión y recarga la página.</p></div>';
}

if (DEMO) {
  // Vista previa con datos de ejemplo: ?demo (añade #nueva o #lista para otros casos)
  pintar(demo());
  window.addEventListener('hashchange', () => pintar(demo()));
} else if (!/^[A-Z0-9]{8,16}$/.test(CODIGO)) {
  pintar(null);
} else {
  // Muestra al instante la última tarjeta guardada en este móvil y la actualiza cuando llegan los datos
  const CLAVE_DATOS = 'impresiona_datos_' + CODIGO;
  const previo = leer(CLAVE_DATOS);
  if (previo) pintar(previo);
  const control = new AbortController();
  const limite = setTimeout(() => control.abort(), 25000);
  fetch(DATOS_URL + encodeURIComponent(CODIGO), { signal: control.signal, credentials: 'omit' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => {
      if (j && j.ok) {
        const iguales = previo && JSON.stringify(previo) === JSON.stringify(j.datos);
        guardar(CLAVE_DATOS, j.datos);
        if (!iguales) pintar(j.datos);   // solo se repinta si algo cambió (evita que la barra se anime dos veces)
      }
      else { borrar(CLAVE_DATOS); pintar(null); }
    })
    .catch(() => { if (!previo) errorDeCarga(); })
    .finally(() => clearTimeout(limite));
}
